alias: ePaper Schedule Downloader
description: Schedule the wake times for a collection of ePaper devices
icon: mdi:calendar-arrow-right
fields:
  epaper_devices:
    name: ePaper Devices
    description: Devices to send images to
    required: true
    selector:
      device:
        multiple: true
        filter:
          - integration: esphome
            manufacturer: "Stebbins"
            model: "ePaperDisplay"
  slideshow_schedule:
    name: Slideshow Schedule
    description: Specify when images are updated
    required: true
    selector:
      entity:
        multiple: false
        filter:
          domain:
            - schedule
mode: single
max_exceeded: silent
sequence:
  - variables:
      day_names: '{{ ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"] }}'
  - action: schedule.get_schedule
    target:
      entity_id: '{{ slideshow_schedule }}'
    response_variable: wake_schedule
  - repeat:
      for_each: '{{ epaper_devices }}'
      sequence:
        - variables:
            epaper_device: '{{ repeat.item }}'
            mac: '{{ "_" + device_attr(epaper_device, "name")[-6:] + "_" }}'
            set_schedule_action: '{{ "esphome.poster_seeed" + mac + "set_schedule" }}'
            index: '{{ repeat.index }}'
            api_connection_entity: '{{ device_entities(epaper_device) | select("match", ".*_api_connection") | first }}'
            json_schedule: >-
              {% set count = epaper_devices | length %}
              {% set ns0 = namespace(days=[]) %}
              {% for day_of_week in day_names %}
                {% set ns1 = namespace(events=[]) %}
                {% set event_count = wake_schedule[slideshow_schedule][day_of_week] | length %}
                {% for ii in range(((event_count + count - 1) / count) | int) %}
                  {% set jj = ii * count + index - 1 %}
                  {% if jj < event_count %}
                    {% set event = wake_schedule[slideshow_schedule][day_of_week][jj] %}
                    {% set from = event.from.strftime("%H:%M") %}
                    {% set ns1.events = ns1.events + [from] %}
                  {% endif %}
                {% endfor %}
                {% set ns0.days = ns0.days + [{"events": ns1.events}] %}
              {% endfor %}
              {{ { "days": ns0.days } }}
        - if:
            - condition: template
              value_template: '{{ is_state(api_connection_entity, "off") }}'
          then:
            - wait_for_trigger:
                - trigger: template
                  value_template: '{{ is_state(api_connection_entity, "on") }}'
        - action: '{{ set_schedule_action }}'
          data:
            schedule: '{{ json_schedule }}'
