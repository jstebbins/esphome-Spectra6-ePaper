# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: ESPHome ePaper Frame
description: >- # this means to ignore newlines until "baseurl:"
  ESPHome custom firmware for the Seeed Studio reTerminal E1004 6-color ePaper display
baseurl: "/esphome-Spectra6-ePaper" # the subpath of your site, e.g. /blog
url: "https://jstebbins.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username:

author:
  social:
    github: jstebbins/esphome-Spectra6-ePaper

# Build settings
#theme: minima
theme: jekyll-theme-hydejack
#remote_theme: hydecorp/hydejack
theme_color: rgb(140, 107, 62)
accent_color: rgb(140, 107, 62)
accent_image: none
plugins:
  - jekyll-feed

# Exclude from processing.
