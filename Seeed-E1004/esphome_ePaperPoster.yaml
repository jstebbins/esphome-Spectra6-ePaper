# =============================================================================
# [9] Deep sleep
# The device wakes, updates sensors and display, then sleeps.
# Press any front GPIO4 button to wake manually at any time.
# =============================================================================

deep_sleep:
  id: dsleep
  # FYI: The E1004 does not have a 32khz crystal wired into the esp32 internal RTC,
  # so the timers drift quite a lot.  10s of seconds per hour. There is an external
  # PCF8563 that is accurate, but it is not used for deep sleep. The system time
  # gets updated when we boot, but we likely woke early.
  #
  # Setting 'run_duration' here results in a non-cancelable run
  # timeout being set very early in the boot sequence. This means
  # it can not be reset to some other value.  So I do not set
  # 'run_duration' here and instead initialize it in the 'on_boot' block.
  #
  # Default sleep duration 
  # Is overridden by number 'sleep_duration' or datetime 'wake_time'
  sleep_duration: ${initial_run_sleep_cycle - initial_run_duration}min
  esp32_ext1_wakeup:
    pins:
      - pin:
          number: GPIO3
          allow_other_uses: true
          mode: INPUT_PULLUP
        on_wake:
          - globals.set:
              id: wake_source
              value: '3'
      - pin:
          number: GPIO4
          allow_other_uses: true
          mode: INPUT_PULLUP
        on_wake:
          - globals.set:
              id: wake_source
              value: '4'
      - pin:
          number: GPIO5
          allow_other_uses: true
          mode: INPUT_PULLUP
        on_wake:
          - globals.set:
              id: wake_source
              value: '5'
    mode: ANY_LOW
  on_wake:
    - if:
        condition:
          lambda: 'return cause != deep_sleep::WAKEUP_CAUSE_GPIO;'
        then:
          - globals.set:
              id: wake_source
              value: '1'
            
