# =============================================================================
# Based on reTerminal E1004 - ESPHome Full Hardware Example
# https://seeed-projects.github.io/OSHW-reTerminal-Series-E-D/?platform=esphome&device=E1004
# =============================================================================
#
# Hardware list:
#   1. 13.3" 6-color ePaper display (1200x1600, T133A01)
#   2. 3x front buttons (GPIO3, GPIO4, GPIO5)
#   3. Buzzer (GPIO45, PWM)
#   4. Onboard LED (GPIO48)
#   5. Battery voltage (GPIO1 ADC + GPIO21 EN)
#   6. SHT4x temp & humidity sensor (I2C)
#   7. PCF8563 RTC (I2C addr 0x51, CR1220 backup)
#   8. MicroSD card slot (SPI + DET=15, EN=16)
#   9. Deep sleep with GPIO4 button wake-up
#
# Requires ESPHome >= 2026.7.0 for the epaper_spi E1004 model.
#
# Serial debug: UART0 via CH340K USB bridge
# =============================================================================

globals:
  # ###########################################################################
  # This group of globals are transient. They are reset upon sleep or powerdown
  # ###########################################################################
 
  # When woken from deep sleep, record the cause here
  # This will be used to publish a wake cause event
  # to HA after a client connection is established.
  - id: wake_source
    type: int
    restore_value: false
    initial_value: '0'
  # Reference counted sleep prevent/allow
  - id: sleep_prevent_count
    type: int
    restore_value: false
    initial_value: '0'
  # Sleep gets disabled if cycle time <= run time
  - id: sleep_enabled
    type: bool
    restore_value: false
    initial_value: 'true'
  # Track if sleep will occur when allowed
  - id: sleep_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: sleep_duration
    type: time_t
    restore_value: false
    initial_value: '0'
  # Track when we wake from sleep. If we are put to sleep early
  # we must adjust the sleep period to keep the cycle time accurate.
  - id: run_start_timestamp
    type: time_t
    restore_value: false
    initial_value: '0'
  - id: run_timer_delay
    type: int
    restore_value: false
    initial_value: '0'
  # When the esp32 internal RTC wakes us early, this is the amount
  # of time we must wait before sending the wake_at_timeout event.
  - id: wake_at_delay
    type: time_t
    restore_value: false
    initial_value: '0'
  - id: wake_time_expired
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: factory_reset_requested
    type: bool
    restore_value: false
    initial_value: 'false'

  # ###########################################################################
  # This group of globals gets backed up to NVS
  # ###########################################################################
 
  # Convenience flag to let us know we are waking on a constant cycle
  - id: use_schedule
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: improv_setup_page_active
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: next_wake_timestamp
    type: time_t
    restore_value: true
    initial_value: '0'
  # The schedule gets stored to NVS as compact int16_t events
  # The low 6 bits are minutes, and remaining high bits are hours
  # The space allocated permits ~ 7d x 24h - 20min intervals.
  # I don't require more than this, but the sizes are easily adjusted...
  #
  # schedule_days is an array of indicies pointing to where a day's events start
  - id: schedule_days
    type: int16_t[8]
    restore_value: true
    initial_value: '{0,0,0,0,0,0,0,0}'
  # schedule_events is a linear array that covers the entire week.
  - id: schedule_events
    type: int16_t[512]
    restore_value: true
    initial_value: '{0,0}'
    
substitutions:
  # If you take control of this device and you have multiple instances
  # of the device, you will require unique device names if you want to
  # update them over wifi
  device_name: poster-seeed
  friendly_name: "PosterSeeed"
  # Note: initial_run_sleep_cycle - initial_run_duration must be positive.
  # If you want to disable deep sleep, you will need to adjust the deep_sleep component
  initial_run_duration: 4
  initial_run_sleep_cycle: 10
  # Noises
  rtttl_one_short: "one_short:d=4,o=5,b=100:16e6"
  rtttl_two_short: "two_short:d=4,o=5,b=100:16e6,16e6"
  rtttl_one_long: "one_long:d=1,o=5,b=100:e6"
  rtttl_siren: "siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e"
  rtttl_scale_up: "scale_up:d=32,o=5,b=100:c,c#,d#,e,f#,g#,a#,b"
  rtttl_furelise: "furelise:d=8,o=5,b=125:e6,d#6,e6,d#6,e6,b,d6,c6,4a,p,c,e,a,4b,p,e,g#,b,4c6,p,e,e6,d#6,e6,d#6,e6,b,d6,c6,4a,p,c,e,a,4b,p,e,c6,b,2a"
  rtttl_popcorn: "popcorn:d=16,o=5,b=63:c#6,b,c#6,g#,32e,g#,8c#,c#6,b,c#6,g#,32e,g#,8c#,c#6,d#6,e6,32d#6,e6,32e6,c#6,d#6,32c#6,d#6,32d#6,b,c#6,32b,c#6,32c#6,a,8c#6"
  rtttl_chicken: "chicken:d=32,o=5,b=50:g#,g#,a#,a#,f,f,16g#,g#,g#,a#,a#,f,f,16g#,g#,g#,a#,a#,c#6,c#6,16c6,16c6,16a#,16g#,16f#,f#,f#,g#,g#,d#,d#,16f#,f#,f#,g#,g#,d#,d#,16f#,f#,f#,g#,g#,a#,c6,16c#6,16a#,16g#,16f,16c#"
  rtttl_bumble: "bumble:d=4,o=5,b=160:16e,16d#,16d,16c#,16c,16f,16e,16d#,16e,16d#,16d,16c#,16c,16c#,16d,16d#,16e,16d#,16d,16c#,16c,16f,16e,16d#,16e,16d#,16d,16c#,16c,16c#,16d,16d#,16e,16d#,16d,16c#,16c"
  rtttl_sos: "sos:d=16,o=6,b=160:g,p,g,p,g,4p,8g.,p,8g.,p,8g.,4p,g,p,g,p,g,1p,g,p,g,p,g,4p,8g.,p,8g.,p,8g.,4p,g,p,g,p,g"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Set an identifiable Manufacturer.Model that can be used in blueprints
  # to limit device options to devices that support the features implemented here.
  project:
    name: Stebbins.ePaperDisplay
    version: dev
  includes:
    - <sstream>
    - <regex>
    - images_png.h
  on_boot:
    priority: -100
    then:
      # Turn on SD card power rail / 打开 SD 卡供电
      - output.turn_on: bsp_sd_enable
      # Turn on battery measurement circuit
      - output.turn_on: bsp_battery_enable
      # Wait for voltages to stabilize / 等待电压稳定
      - delay: 200ms
      # Take the first temperature and humidity reading
      - component.update: sht4x_sensor
      - wait_until:
          condition:
            lambda: return id(temp_sensor).has_state() && id(hum_sensor).has_state();
          timeout: 5s
      # Take first battery reading / 采集首次电池读数
      - component.update: battery_voltage
      - component.update: battery_level
      # Read external RTC time on boot / 启动时读取 RTC 时间
      - pcf8563.read_time:
      # Record boot time
      - lambda: |-
          id(run_start_timestamp) = id(rtc_time).now().timestamp;
      # Start the run_timer. This determines how long we will remain running
      # before the next sleep.
      - script.execute: run_timer
      - logger.log:
          format: 'Run start time: %lld'
          args: ['id(run_start_timestamp)']
      - if:
          condition:
            lambda: "return (id(wake_source) <= 1);"
          then:
            # The esp32 internal RTC wakes us early due to drift.
            # Send a wake_at_timeout event when the wake_at time actually
            # arrives.
            - script.execute: wake_time_timer
      # Run a short buzzer if wakeing up from button press
      # to indicate we are alive
      - if:
          condition:
            lambda: 'return id(wake_source) > 1;'
          then:
            - rtttl.play: ${rtttl_one_short}
      - if:
          condition:
            lambda: |-
              esphome::wifi::WiFiAP sta = id(my_wifi).get_sta();
              StringRef ssid = sta.get_ssid();
              if (ssid.empty()) {
                ESP_LOGD("boot", "No SSID");
                return true;
              }
              ESP_LOGD("boot", "SSID %s", ssid.c_str());
              return false;
          then:
            - logger.log: "Improv waiting for activation"
            - script.execute: show_improv_setup
      - script.execute: improv_setup_timer

esp32:
  variant: esp32s3
  board: seeed_xiao_esp32s3
  # The E1004 has 32MB of flash. But it's flash chip (ZB25Q256AYJG) is not listed as supported
  # in 4 byte addressing mode by esp-idf yet. However, this seems to work...
  flash_size: 32MB
  cpu_frequency: 240MHZ
  # At the default 40Mhz psram speed, full screen image render exceeds
  # the default task WDT of 5s. Extend the task WDT to 10s to
  # prevent WDT reboot.
  watchdog_timeout: 10s
  framework:
    type: esp-idf
    version: latest
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_UART_NUM: "0"
      CONFIG_ESP_CONSOLE_UART_TX_GPIO: "43"
      CONFIG_ESP_CONSOLE_UART_RX_GPIO: "44"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

# OPI PSRAM stores the 6-color display framebuffer.
psram:
  mode: octal
  # At the default 40Mhz psram speed, full screen image render exceeds
  # the default task WDT of 5s. Boost psram speed to 80Mhz to
  # prevent WDT reboot.
  #
  # I have not found documentation that definitively specs the
  # speed of the psram used in this device. This is working for me
  # but YMMV
  speed: 80MHZ
  ignore_not_found: false

# Wi-Fi settings / Wi-Fi 设置
wifi:
  id: my_wifi
  use_psram: true
  on_connect:
    then:
      - delay: 5s
      - ble.disable
      - script.execute: show_improv_setup_complete
        
network:
  enable_ipv6: true

# Enable serial logging / 启用串口日志
# The reTerminal E series has a CH340K USB-to-UART bridge on UART0.
# Default ESP32-S3 logger uses USB_CDC — won't produce output on the physical port.
# reTerminal E 系列板载 CH340K 桥接芯片，串口走 UART0，非默认的 USB_CDC。
logger:
  hardware_uart: UART0

# Home Assistant native API / Home Assistant 原生 API
api:
  id: my_api
  encryption: # Let HomeAssistant assign the key
  outgoing_connection:
  actions:
    - action: show_image
      description: Download and show an image URL
      variables:
        image_url:
          type: string
          description: A URL to an image (PNG)
          example: "http://homeassistant.local:8123/local/Images/some_image.png"
      then:
        - script.execute: sleep_prevent
        - online_image.set_url:
            id: current_image
            update: true
            url: !lambda "return image_url;"
    - action: play_kazoo
      description: Play a melody on the buzzer
      variables:
        song_str:
          type: string
          description: Melody in RTTTL format
          example: "two_short:d=4,o=5,b=100:16e6,16e6"
      then:
        - rtttl.play:
            rtttl: !lambda "return song_str;"
    # Receive a JSON schedule.
    # The schedule gets stored to NVS as compact int16_t events
    # So the space allocated should allow ~ 7d x 24h - 20min interval
    # fully populated schedule.
    # I don't require more than this, but the sizes are easily adjusted...
    - action: set_schedule
      description: Set Wake Schedule
      supports_response: status
      variables:
        schedule:
          type: string
          description: JSON schedule
          example: '{"days" : [{ "events": ["14:00", ...]}, ...]}'
      then:
        - if:
            condition:
              - lambda: |-
                  // Validate the data
                  int event_count = 0;
                  JsonDocument jschedule = esphome::json::parse_json(schedule);

                  if (!jschedule["days"].is<JsonArray>()) {
                    ESP_LOGW("api", "Error: Schedule missing 'days' array");
                    return false;
                  }
                  JsonArray days = jschedule["days"];
                  if (days.size() > 7) {
                    ESP_LOGW("api", "Error: Schedule must contain at most 7 days");
                    return false;
                  }
                  for (int ii = 0; ii < days.size(); ii++) {
                    if (!days[ii].is<JsonObject>()) {
                      ESP_LOGW("api", "Error: Schedule day is not JSON object");
                      return false;
                    }
                    if (!days[ii]["events"].is<JsonArray>()) {
                      ESP_LOGW("api", "Error: Schedule day missing events array");
                      return false;
                    }
                    JsonArray events = days[ii]["events"];
                    std::regex pattern("[0-9]{2}:[0-9]{2}"); // "HH:MM"
                    event_count += events.size();
                    for (int jj = 0; jj < events.size(); jj++) {
                      if (!events[jj].is<JsonString>()) {
                        ESP_LOGW("api", "Error: Schedule event is not string");
                        return false;
                      }
                      std::string event(events[jj]);
                      if (!regex_match(event, pattern)) {
                        ESP_LOGW("api", "Error: Improperly formatted event %s", event.c_str());
                        return false;
                      }
                    }
                  }
                  if (event_count > 512) {
                    ESP_LOGW("api", "Error: Schedule is too large, events %d", event_count);
                    return false;
                  }

                  // Store the schedule in a more compact format
                  int next_event = 0;
                  for (int ii = 0; ii < days.size(); ii++) {
                    id(schedule_days)[ii] = next_event;
                    JsonArray events = days[ii]["events"];
                    for (int jj = 0; jj < events.size(); jj++) {
                      int hh, mm;
                      std::string event(events[jj]);
                      std::stringstream event_ss(event);
                      // Hour < 24, fits in 5 bits
                      event_ss >> hh;
                      event_ss.ignore(1, ':');
                      // Minutes < 60, fits in 6 bits
                      event_ss >> mm;
                      id(schedule_events)[next_event] = (hh << 6) | mm;
                      next_event++;
                    }
                  }
                  // Mark the end of day 7's events
                  id(schedule_days)[7] = next_event;
                  return true;
            then:
              - api.respond:
                  success: true
            else:
              - api.respond:
                  success: false
                  error_message: "Invalid Schedule"

    - action: get_schedule
      description: Get Wake Schedule
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              JsonArray days = root["days"].to<JsonArray>();
              for (int ii = 0; ii < 7; ii++) {
                JsonObject day = days[ii].to<JsonObject>();
                JsonArray events = day["events"].to<JsonArray>();
                int event_count = id(schedule_days)[ii + 1] - id(schedule_days)[ii];
                for (int jj = id(schedule_days)[ii]; jj < id(schedule_days)[ii + 1]; jj++) {
                  unsigned char hh = id(schedule_events)[jj] >> 6;
                  unsigned char mm = id(schedule_events)[jj] & 0x3f;
                  char event[6];
                  snprintf(event, 6, "%02hhd:%02hhd", hh, mm);
                  events.add(event);
                }
              }

  on_client_connected:
    # Send events and button presses that triggered a wake-up.
    # Nothing is sent if we are simply reconnecting due to communication loss.
    then:
      # Cancel the improv_setup_timer
      - script.execute: improv_setup_timer
      # You would think we would be ready to send events
      # when 'on_client_connected' triggers, but no.
      # Documentation says we must delay a short time here before
      # attempting to any communication.
      - delay: 2s
      - lambda: |-
          ESP_LOGD("api", "api forward %d", id(wake_source));
          switch (id(wake_source)) {
            case 1:
              id(events).trigger("sleep_timeout");
              break;
            case 3:
              id(events).trigger("right_button_press");
              break;
            case 4:
              id(events).trigger("left_button_press");
              break;
            case 5:
              id(events).trigger("refresh_button_press");
              break;
            default:
              break;
          }
      - script.execute: trigger_wake_event
      - globals.set:
          id: wake_source
          value: '0'

# OTA (Over-The-Air) firmware update / 空中固件更新
ota:
  - platform: esphome
    id: ota_esphome
    # Prevent sleep while OTA is in progress
    on_begin:
      then:
        - logger.log: "OTA Start"
        - script.execute: sleep_prevent
    on_progress:
      then:
        - logger.log:
            format: "Progress %01f%%"
            args: ["x"]
    on_end:
      then:
        - logger.log: "OTA Success"
        - script.execute: sleep_allow
    on_error:
      then:
        - logger.log: "OTA Fail"
        - script.execute: sleep_allow

esp32_ble:
  use_psram: true
  name: posterseeed
  enable_on_boot: false

improv_ble:
  authorizer: button_5
  on_start:
    then:
      - logger.log: "Improv waiting for authorization"
  on_provisioned:
    then:
      - logger.log: "Improv provisioned"
  on_stop:
    then:
      - logger.log: "Improv stopped"

improv_serial:
  
# SPI — shared by ePaper display and SD card
# SPI — 墨水屏和 SD 卡共用
spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9
  # MISO is needed for SD card reading (ePaper is write-only)
  # MISO 用于 SD 卡读取（墨水屏只写不读）
  miso_pin: GPIO8

# I2C — shared by SHT4x sensor, PCF8563 RTC
# I2C — SHT4x 传感器和 PCF8563 实时时钟共用
i2c:
  scl: GPIO20
  sda: GPIO19

output:
  # [4] Onboard LED (active low)
  # It's really unfortunate that this LED is not visible from the
  # front of the picture frame. It would be useful as an
  # activity indicator if it was :(
  - platform: gpio
    pin: GPIO48
    id: bsp_led

  # [9] SD card power enable
  - platform: gpio
    pin: GPIO16
    id: bsp_sd_enable

  # [5] Battery measurement enable
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

  # [3] Buzzer PWM output
  - platform: ledc
    pin: GPIO45
    id: buzzer_pwm

rtttl:
  output: buzzer_pwm
  id: kazoo
  gain: 60%

sensor:
  # --- Battery voltage (ADC on GPIO1) ---
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      # Compensate for onboard voltage divider (1:2)
      # 补偿板载分压电阻（1:2 比例）
      - multiply: 2.0

  # --- Battery level (percentage) ---
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: 'return id(battery_voltage).state;'
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

  # --- SHT4x temperature & humidity (I2C) ---
  - platform: sht4x
    id: sht4x_sensor
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Relative Humidity"
      id: hum_sensor
    update_interval: 60s

  - platform: template
    name: "Sleep Duration"
    id: sleep_duration_sensor
    icon: "mdi:timer-sand"
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      return id(sleep_duration) / 1000;

binary_sensor:
  # API Connection status
  - platform: status
    name: "API Connection"

  # KEY3 (GPIO3)
  - platform: gpio
    pin:
      number: GPIO3
      allow_other_uses: true
      mode: INPUT
      inverted: true
    id: button_3
    name: "KEY3 Right Direction Button"
    internal: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_click:
      then:
        - logger.log: "KEY3 (GPIO3) pressed"
        # Make some noise to acknowledge that the button press was recognized
        - rtttl.play: ${rtttl_one_short}
        - wait_until:
            condition:
              not:
                rtttl.is_playing:
            timeout: 2s
        - event.trigger:
            id: events
            event_type: right_button_press
        # I would like to restart the run timout, but esphome doesn't support this :(
    on_double_click:
      then:
        - logger.log: "KEY3 (GPIO3) double pressed"
        - event.trigger:
            id: events
            event_type: right_button_double_press
    on_release:
      then:
        - script.execute: activity_sleep_prevent

  # KEY4 (GPIO4)
  - platform: gpio
    pin:
      number: GPIO4
      allow_other_uses: true
      mode: INPUT
      inverted: true
    id: button_4
    name: "KEY4 Left Direction Button"
    internal: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_click:
      then:
        - logger.log: "KEY4 (GPIO4) pressed"
        # Make some noise to acknowledge that the button press was recognized
        - rtttl.play: ${rtttl_one_short}
        - wait_until:
            condition:
              not:
                rtttl.is_playing:
            timeout: 2s
        - event.trigger:
            id: events
            event_type: left_button_press
        # I would like to restart the run timout, but esphome doesn't support this :(
    on_double_click:
      then:
        - logger.log: "KEY4 (GPIO4) double pressed"
        - event.trigger:
            id: events
            event_type: left_button_double_press
    on_release:
      then:
        - script.execute: activity_sleep_prevent

  # KEY5 (GPIO5)
  - platform: gpio
    pin:
      number: GPIO5
      allow_other_uses: true
      mode: INPUT
      inverted: true
    id: button_5
    name: "KEY5 Refresh Button"
    internal: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_click:
      then:
        - logger.log: "KEY5 (GPIO5) pressed"
        # Make some noise to acknowledge that the button press was recognized
        - rtttl.play: ${rtttl_one_short}
        - wait_until:
            condition:
              not:
                rtttl.is_playing:
            timeout: 1s
        - event.trigger:
            id: events
            event_type: refresh_button_press
        # I would like to restart the run timout, but esphome doesn't support this :(
    on_double_click:
      then:
        - logger.log: "KEY5 (GPIO5) double pressed"
        - event.trigger:
            id: events
            event_type: refresh_button_double_press
    on_release:
      then:
        - script.execute: activity_sleep_prevent
        - if:
            condition:
              lambda: return id(factory_reset_requested);
            then:
              - button.press: factory_reset_button
    on_multi_click:
      - timing:
          - ON for at least 10s
        then:
          # Double chirp warning that factory reset is aproaching
          - rtttl.play: ${rtttl_two_short}
      - timing:
          - ON for at least 20s
        then:
          # Long Buzz to notify that factory reset is initiated
          - rtttl.play: ${rtttl_one_long}
          - lambda: id(factory_reset_requested) = true;

  # [9] SD card detect (LOW = card present)
  # SD 卡检测（低电平 = 卡已插入）
  #
  # NOTE on SD card in ESPHome:
  # ESPHome cannot directly access the SD card file system (read/write files,
  # create directories, etc.) the way Arduino can. In ESPHome, the SD card is
  # used indirectly by specific components:
  #   - online_image: caches downloaded images to SD card
  #   - media_player: plays audio files stored on the card
  #   - Works with PSRAM for large buffer allocation
  # For direct file operations (e.g. recording WAV files), use the Arduino framework.
  #
  # ESPHome 中 SD 卡的限制：
  # ESPHome 不能像 Arduino 那样直接操作 SD 卡文件系统（读写文件、创建目录等）。
  # SD 卡在 ESPHome 中由特定组件间接使用：
  #   - online_image：将下载的图片缓存到 SD 卡
  #   - media_player：播放卡上存储的音频文件
  #   - 配合 PSRAM 做大缓冲
  # 如需直接操作文件（如录音存 WAV），请使用 Arduino 框架。
  - platform: gpio
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    id: sd_card_detect
    name: "SD Card Detected"

text_sensor:
  - platform: template
    name: "Next wake time"
    id: next_wake_time_sensor
    icon: "mdi:clock"
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      if (id(next_wake_timestamp) == 0) {
        return {};
      }
      ESPTime next = ESPTime::from_epoch_local(id(next_wake_timestamp));
      std::string next_str = next.strftime("%c");
      return {next_str};

script:
  - id: run_timer
    mode: single
    then:
      - script.execute: sleep_prevent
      - while:
          condition:
            lambda: |-
              time_t now_timestamp = id(rtc_time).now().timestamp;
              if (now_timestamp - id(run_start_timestamp) >= id(run_duration).state * 60 
                  && (id(use_schedule) || id(run_duration) < id(run_sleep_cycle))) {
                // Run expired
                return false;
              }
              int delay = id(run_duration).state * 60 - (now_timestamp - id(run_start_timestamp));
              if (delay < 0 || delay > 30) {
                // delay < 0 means sleep is being deferred for some reason
                // Max delay 30s to allow for on-the-fly changes to parameters
                delay = 30;
              }
              id(run_timer_delay) = delay;
              return true;
          then:
            - delay: !lambda "return id(run_timer_delay) * 1000;"
      - script.execute: sleep_allow

  # Prevent sleep for a specified period of time when there is user activity
  # I.e. button presses
  #
  # What I really would prefer doing is extend the run time of the current
  # sleep/wake cycle.  But esphome does not have any method to update the
  # timer used for the current run period.  So this is my next best option.
  - id: activity_sleep_prevent
    mode: parallel
    then:
      - logger.log: "activity_sleep_prevent"
      - script.execute: sleep_prevent
      - delay: !lambda "return id(activity_sleep_block_time).state * 60 * 1000;"
      - logger.log: "activity_sleep_prevent allow"
      - script.execute: sleep_allow

  # Show user instructions for connecting the device to HomeAssistant
  - id: show_improv_setup
    mode: single
    then:
      - ble.enable
      - rtttl.play: ${rtttl_scale_up}
      - if:
          condition:
            lambda: 'return !id(improv_setup_page_active);'
          then:
            - globals.set:
                id: improv_setup_page_active
                value: 'true'
            # Improv will not automatically enable BLE when
            # needed (unfortunate). It would really be nice
            # if improv had an 'on_activation_required' automation
            # that could be used to kick everything off with. Instead
            # I must check if the SSID has been set or we've failed
            # to connect to WiFi for some period of time manually,
            # which duplicates what Improv already does when ble is
            # enabled on boot.
            - logger.log: "show setup image"
            - script.execute: sleep_prevent
            - display.page.show: improv_setup
            - component.update: epaper_display
            - wait_until:
                condition:
                  component.is_idle: epaper_display
                timeout: 60s
            - script.execute: sleep_allow

  # Show an image indicating setup is complete
  - id: show_improv_setup_complete
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(improv_setup_page_active);'
          then:
            - globals.set:
                id: improv_setup_page_active
                value: 'false'
            - logger.log: "show setup complete image"
            - script.execute: sleep_prevent
            - display.page.show: improv_setup_complete
            - component.update: epaper_display
            - rtttl.play: ${rtttl_popcorn}
            - wait_until:
                condition:
                  component.is_idle: epaper_display
                timeout: 60s
            - script.execute: sleep_allow

  # improv_setup_timer is run on boot.  If we do not connect to wifi and HomeAssistant
  # after 1 minute, show the Improv setup page. This timer can be canceled by
  # running the script again when connected.
  - id: improv_setup_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(my_wifi).is_connected() || !id(my_api).is_connected();'
          then:
            - delay: 60s
            - if:
                condition:
                  lambda: 'return !id(my_wifi).is_connected() || !id(my_api).is_connected();'
                then:
                  script.execute: show_improv_setup

  - id: set_next_wake_time
    mode: queued
    parameters:
      prev_wake_time: time_t
    then:
      - lambda: |-
          ESPTime now = id(rtc_time).now();
          if (prev_wake_time > now.timestamp) {
            now = ESPTime::from_epoch_local(prev_wake_time);
          }
          ESPTime     next      = now;
          int         now_dm    = now.hour * 60 + now.minute;
          int         week_day  = now.day_of_week - 1;
          int         day       = week_day;

          // Search today's schedule for next wake-time
          for (int ii = id(schedule_days)[day]; ii < id(schedule_days)[day+1]; ii++) {
              int event, hh, mm, dm;
              event = id(schedule_events)[ii];

              hh = event >> 6;
              mm = event & 0x3f;
              dm = hh * 60 + mm;
              if (dm > now_dm) {
                // Next wake-up is today, set next wake-up
                next.hour = hh;
                next.minute = mm;
                next.second = 0;
                next.recalc_timestamp_local();
                ESP_LOGD("set_next_wake_time", "now %lld prev %lld next %lld",
                        id(rtc_time).now().timestamp, id(next_wake_timestamp), next.timestamp);
                id(next_wake_timestamp) = next.timestamp;
                return;
              }
          }
          // Check the first item in future day schedules
          for (int ii = 1; ii <= 7; ii++) {
            day = (week_day + ii) % 7;
            next.increment_day();

            if (id(schedule_days)[ii] < id(schedule_days)[ii+1]) {
              int event;
              event = id(schedule_events)[ii];
              next.hour = event >> 6;
              next.minute = event & 0x3f;
              next.second = 0;
              next.recalc_timestamp_local();
              ESP_LOGD("set_next_wake_time", "now %lld prev %lld next %lld",
                      id(rtc_time).now().timestamp, id(next_wake_timestamp), next.timestamp);
              id(next_wake_timestamp) = next.timestamp;
              return;
            }
          }

          // No future schedule item found, try again tomorrow
          // This should only happen for an empty schedule
          now.increment_day();
          now.recalc_timestamp_local();
          ESP_LOGD("set_next_wake_time", "now %lld prev %lld next %lld",
                  id(rtc_time).now().timestamp, id(next_wake_timestamp), next.timestamp);
          id(next_wake_timestamp) = now.timestamp;
      - component.update: next_wake_time_sensor
      - wait_until:
          condition:
            component.is_idle: next_wake_time_sensor
          timeout: 2s

  - id: trigger_wake_event
    mode: single
    then:
      - if:
          condition:
            and:
              - api.connected:
              - lambda: 'return id(wake_time_expired);'
          then:
            - event.trigger:
                id: events
                event_type: wake_at_timeout
            - globals.set:
                id: wake_time_expired
                value: 'false'

  # The esp32 internal RTC doesn't have a crystal and drifts, causing the time that we wake to
  # be inaccurate - early in every case I've seen. This script will wait for the requested 
  # wake time and then fire an event to notify that the actual requested time has arrived.
  #
  # If the calculated delay time is longer than the set run time, re-enter sleep.
  - id: wake_time_timer
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(use_schedule);'
          then:
            # Calculate how early we woke
            - lambda: |-
                ESPTime espNow    = id(rtc_time).now();
                time_t  now       = espNow.timestamp;
      
                ESP_LOGD("wake_time_timer", "now %lld wake_time %lld", now, id(next_wake_timestamp));
                id(wake_at_delay) = id(next_wake_timestamp) - now;
            - if:
                condition:
                  lambda: 'return id(wake_at_delay) <= 0;'
                then:
                  - globals.set:
                      id: wake_time_expired
                      value: 'true'
                  - logger.log:
                      format: "Woke late or on time %lld sec"
                      args: ['id(wake_at_delay)']
                  - script.execute: trigger_wake_event
                else:
                  - if:
                      condition:
                        lambda: 'return id(wake_at_delay) > id(run_duration).state * 60 + 30;'
                      then:
                        # We can safely stay awake and let the run time expire. The sleep
                        # timer will wake us again prior to the desired wake time.
                        - logger.log:
                            format: "Woke very early, sleeping for %lld sec"
                            args: ['id(wake_at_delay)']
                      else:
                        # Delay until the desired wake time
                        # Since it's possible the run time may expire during this,
                        # prevent sleep while waiting.
                        - script.execute: sleep_prevent
                        - logger.log:
                            format: "Delay till scheduled event time %lld sec"
                            args: ['id(wake_at_delay)']
                        - delay: !lambda "return id(wake_at_delay) * 1000 + 500;"
                        - globals.set:
                            id: wake_time_expired
                            value: 'true'
                        - script.execute: trigger_wake_event
                        - script.wait: trigger_wake_event
                        - script.execute: sleep_allow

  # Handle changes to sleep duration
  #
  # run_duration    - minutes
  #                   Used to adjust 'sleep_duration' when schedule is used
  # run_sleep_cycle - minutes
  #                   When not using 'wake_at' sleep type, this is the run/sleep cycle time.
  #                   If run_duration >= run_sleep_cycle, sleep is disabled.
  # next_wake_time  - time_t timestamp of next wake time
  #
  # Ideally, this would be called just prior to going into deep sleep
  # so that 'wake time' can be correctly calculated based on when
  # sleep starts. But there is no callback to alert us at the end
  # of 'run_duration' that we are entering the sleep period. So as
  # a work-around, this gets called at boot time, any time values change,
  # and when sleep is initiated manually.
  - id: eval_sleep_duration
    mode: restart
    parameters:
      run_sleep_cycle: int # minutes
      next_wake_time: time_t
    then:
      - lambda: |-
          ESP_LOGD("eval_sleep_duration", "cycle %d, next %lld", run_sleep_cycle, next_wake_time);
          time_t duration;
          time_t now_timestamp = id(rtc_time).now().timestamp;
          if (!id(use_schedule)) {
            time_t  run_duration = now_timestamp - id(run_start_timestamp);
            duration = (run_sleep_cycle * 60 - run_duration) * 1000;
          } else {
            ESP_LOGD("eval_sleep_duration", "Schedule: now %lld next %lld", now_timestamp, next_wake_time);
            duration = (next_wake_time - now_timestamp) * 1000;
          }
          if (id(sleep_enabled) && duration <= 0) {
            ESP_LOGD("eval_sleep_duration", "sleep prevent");
            id(sleep_enabled) = false;
            id(sleep_prevent).execute();
          }
          if (duration > 0) {
            ESP_LOGD("eval_sleep_duration", "Set sleep duration: %lld ms", duration);
            id(dsleep).set_sleep_duration(duration);
            id(sleep_duration) = duration;
          }
          if (!id(sleep_enabled) && duration > 0) {
            ESP_LOGD("eval_sleep_duration", "sleep allow");
            id(sleep_enabled) = true;
            id(sleep_allow).execute();
          }
      - component.update: sleep_duration_sensor
      - wait_until:
          condition:
            component.is_idle: sleep_duration_sensor
          timeout: 2s
    
    # Handle request to immediately enter deep sleep
  - id: do_sleep
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(sleep_pending);
          then:
            # By asking for an immediate sleep, We are overriding the run_duration.
            # The sleep_prevent executed by run_timer must be reversed to allow sleep.
            - script.execute: sleep_allow
      - lambda: id(sleep_pending) = true;
      - lambda: id(dsleep).begin_sleep(false);

  # 'deep_sleep.prevent/allow' does not reference count. So nested
  # calls would enable sleep upon the first 'deep_sleep.allow'. So
  # this script ref counts prevent/allow
  #
  # Route all sleep prevent/allow through this script.
  # Queued mode provides a locking mechanism to prevent
  # simultaneous modification of sleep_prevent_count.
  - id: sleep_prevent_allow
    mode: queued
    parameters:
      delta: int
    then:
      - logger.log:
          format: "sleep_prevent_count %d delta %d"
          args: ['id(sleep_prevent_count)', 'delta']
      - lambda: id(sleep_prevent_count) += delta;
      - if:
          condition:
            lambda: return id(sleep_prevent_count) == 1;
          then:
            - logger.log: "Prevent Sleep"
            - deep_sleep.prevent: dsleep
      - if:
          condition:
            lambda: return id(sleep_prevent_count) == 0;
          then:
            - if:
                condition:
                  lambda: 'return id(use_schedule);'
                then:
                  - script.execute:
                      id: set_next_wake_time
                      prev_wake_time: !lambda 'return id(rtc_time).now().timestamp;'
                  - script.wait: set_next_wake_time
            - script.execute:
                id: eval_sleep_duration
                run_sleep_cycle: !lambda "return id(run_sleep_cycle).state;"
                next_wake_time: !lambda "return id(next_wake_timestamp);"
            - script.wait: eval_sleep_duration
            - logger.log: "Allow Sleep"
            - deep_sleep.allow: dsleep
      - if:
          condition:
            lambda: return id(sleep_prevent_count) < 0;
          then:
            - logger.log: "Error: Sleep Prevent/Allow Mismatch"
            - globals.set:
                id: sleep_prevent_count
                value: '0'

  - id: sleep_prevent
    mode: parallel
    then:
      - script.execute:
          id: sleep_prevent_allow
          delta: 1

  - id: sleep_allow
    mode: parallel
    then:
      - script.execute:
          id: sleep_prevent_allow
          delta: -1

  # Deocde and display a PNG that is stored in read-only memory
  - id: show_png
    mode: single
    parameters:
      display: esphome::display::Display*
      # index of image in images_png
      index: int
      # orientation of image DISPLAY_ROTATION_0_DEGREES or DISPLAY_ROTATION_90_DEGREES
      rotation: esphome::display::DisplayRotation
    then:
      - lambda: |-
          id(epaper_display).set_rotation(rotation);
          esphome::runtime_image::RuntimeImage img(esphome::runtime_image::ImageFormat::PNG, 
            esphome::image::IMAGE_TYPE_RGB565, esphome::image::TRANSPARENCY_OPAQUE);

          const uint8_t* const png = images_png[index];
          int img_size = images_size[index];
          int offset = 0;

          img.begin_decode(img_size, esphome::runtime_image::ImageFormat::PNG);
          while (!img.is_decode_finished() && offset < img_size) {
            auto consumed = img.feed_data((uint8_t*)&png[offset], img_size - offset);
            if (consumed < 0) {
              ESP_LOGD("display", "Error decoding image");
              break;
            }
            offset += consumed;
          }

          img.end_decode();
          display->image(0, 0, &img);
          img.release();
          
      
button:
  # Virtual button for HomeAssistant to request loading the image URL
  - platform: template
    name: "Refresh Display"
    icon: "mdi:refresh"
    on_press:
      then:
        # I would prefer to group this 'sleep_prevent' with it's matching 'sleep_allow'
        # in the definition of 'current_image', but there is no 'on_download_start' trigger 
        # to attach it to. There is only 'on_download_finished'.
        - logger.log: "refresh online image"
        - script.execute: sleep_prevent
        - online_image.set_url:
            id: current_image
            update: true
            url: !lambda "return id(ImageURL).state;"

  # Virtual button for HomeAssistant to request entry into deep sleep
  - platform: template
    name: "Sleep"
    icon: "mdi:sleep"
    on_press:
      then:
        - script.execute: do_sleep

  # Play the rtttl script in rtttl_song
  - platform: template
    name: "Play RTTTL"
    icon: "mdi:music"
    on_press:
      then:
        - rtttl.play: !lambda "return id(rtttl_song).state;"

  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true

  - platform: restart
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"
    
light:
  - platform: binary
    name: "Onboard LED"
    output: bsp_led
    id: onboard_led

select:
  # 'wake_at' vs 'wake_every' sleep type options
  - platform: template
    id: wake_timer_type
    name: Wake Timer Type
    icon: "mdi:timer-sand"
    options:
      - Schedule
      - Wake Every
    initial_option: Wake Every
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          id(use_schedule) = x.compare("Schedule") == 0;

number:
  # run/sleep cycle time when 'wake_every' sleep type is used
  - platform: template
    id: run_sleep_cycle
    name: Wake Every
    mode: box
    min_value: 0
    max_value: 10080
    step: 1
    optimistic: true
    restore_value: true
    initial_value: ${initial_run_sleep_cycle}
    icon: "mdi:timer-sand"
    device_class: duration
    unit_of_measurement: min

  # How long to block sleep when there us user activity
  - platform: template
    id: activity_sleep_block_time
    name: Activity Timeout
    mode: box
    min_value: 0
    max_value: 60
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 2
    icon: "mdi:timer-sand"
    device_class: duration
    unit_of_measurement: min

  # This is how long the device will remain awake if not
  # explicitly put to sleed by the 'do_sleep' script
  - platform: template
    id: run_duration
    name: Wake Duration
    min_value: 1
    max_value: 1440
    step: 1
    optimistic: true
    restore_value: true
    initial_value: ${initial_run_duration}
    icon: "mdi:timer-sand"
    device_class: duration
    unit_of_measurement: min
    set_action:
      - logger.log:
          format: 'run_duration set to %f'
          args: ['x']

switch:
  # Sets landscape mode. Portrait mode is the default
  - platform: template
    id: landscape_mode
    name: "Landscape"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

event:
  # Events sent to HomeAssistant to notify of various actions
  - platform: template
    name: Actions
    icon: "mdi:run"
    id: events
    device_class: button
    event_types:
      - sleep_timeout
      - wake_at_timeout
      - refresh_button_press
      - left_button_press
      - right_button_press
      - refresh_button_double_press
      - left_button_double_press
      - right_button_double_press
    
time:
  # PCF8563 is at I2C address 0x51 with a CR1220 coin cell backup.
  # On boot we read the RTC; when HA syncs, we write back to the RTC.
  # PCF8563 在 I2C 地址 0x51，由 CR1220 纽扣电池备份。
  # 启动时读取 RTC；当 HA 同步时间后，回写到 RTC。
  #
  # the wake-up time is off.
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    # No periodic re-reads needed; HA sync handles it
    # 无需定期重读；HA 同步来处理
    update_interval: never

  - platform: homeassistant
    # When HA pushes a time sync, write it to the hardware RTC
    # 当 HA 推送时间同步时，写入硬件 RTC
    on_time_sync:
      then:
        - pcf8563.write_time:

# =============================================================================
# [1] ePaper display (13.3" 6-color, 1200x1600, T133A01)
# Requires ESPHome >= 2026.7.0
# =============================================================================
text:
  - platform: template
    id: ImageURL
    name: "Image URL"
    optimistic: true
    min_length: 0
    max_length: 255
    initial_value: "http://homeassistant.local:8123/local/Posters/Poster1.png"
    restore_value: true
    mode: text
    icon: "mdi:image-album"
  - platform: template
    id: rtttl_song
    name: "RTTTL Song"
    optimistic: true
    min_length: 0
    max_length: 255
    initial_value: ${rtttl_furelise}
    restore_value: true
    mode: text
    icon: "mdi:music"

# This is required by the online_image component below
http_request:

image:
  - platform: online_image
    url: "http://homeassistant.local:8123/local/Posters/Poster1.png"
    format: PNG
    type: RGB565
    id: current_image
    # When the download is finished, update the diaplay and wait for
    # the update to complete
    on_download_finished:
      - display.page.show: remote_image
      - lambda: 'id(epaper_display).set_rotation(id(landscape_mode).state ? DISPLAY_ROTATION_90_DEGREES : DISPLAY_ROTATION_0_DEGREES);'
      - component.update: epaper_display
      - wait_until:
          condition:
            component.is_idle: epaper_display
          timeout: 60s
      # Add a short delay to be sure image update is complete.
      - logger.log: "Display says it's done"
      - delay: 1s
      - script.execute: sleep_allow
      - online_image.release: current_image
    on_error:
      then:
        - logger.log: "online_image download error"
        - script.execute: sleep_allow
# It's really too bad there is not a compressed image 'file' format.
# E.g. a compressed image in flash that is decoded when needed.
# All the necessary components exist and it's not too hard to implement.
# So I bundled up the images in a header file and implemented myself.
# See code in the 'show_png' script.

display:
  - platform: epaper_spi
    id: epaper_display
    spi_id: epaper_spi_bus
    model: seeed-reterminal-e1004
    update_interval: never
    auto_clear_enabled: false
    pages:
      - id: remote_image
        lambda: |-
          ESP_LOGD("display", "=== ePaper Online Image Page refresh ===");
          it.image(0, 0, id(current_image));
      - id: improv_setup
        lambda: |-
          ESP_LOGD("display", "=== ePaper Setup Page refresh ===");
          id(show_png).execute(&it, 0, DISPLAY_ROTATION_90_DEGREES);
      - id: improv_setup_complete
        lambda: |-
          ESP_LOGD("display", "=== ePaper Setup Complete Page refresh ===");
          id(show_png).execute(&it, 1, DISPLAY_ROTATION_90_DEGREES);

# =============================================================================
# [9] Deep sleep
# The device wakes, updates sensors and display, then sleeps.
# Press any front GPIO4 button to wake manually at any time.
# =============================================================================

deep_sleep:
  id: dsleep
  # FYI: The E1004 does not have a 32khz crystal wired into the esp32 internal RTC,
  # so the timers drift quite a lot.  Minutes per hour. There is an external
  # PCF8563 that is accurate, but it is not used for deep sleep. The system time
  # gets updated when we boot, but we likely woke early.
  #
  # Setting 'run_duration' here results in a non-cancelable run
  # timeout being set very early in the boot sequence. This means
  # it can not be reset to some other value.
  #
  # My solution is to set a run_duration that is just long enough to boot
  # and start a run_timer script. The run_timer script executes my sleep_prevent
  # script and delay's in a loop until the desired *actual* run_duration
  # has expired. Then it executes my sleep_allow script, at wich point
  # sleep will start.
  #
  # This has a couple of advantages.
  # 1. If the run_duration is changed, it is applied to the current run
  #    and does not need to wait till the next cycle. The default timer
  #    based mechanism does not allow modification of the timer once started.
  # 2. I now know *exactly* when sleep is going to start and can perform
  #    actions just prior to sleep. The default timer based mechanism
  #    is asynchronous with no callback when sleep starts. This allows
  #    code simplification in a number of places.
  #
  # Default sleep duration 
  # Is overridden by number 'sleep_duration' or schedule event
  run_duration: 45s
  sleep_duration: ${initial_run_sleep_cycle - initial_run_duration}min
  esp32_ext1_wakeup:
    pins:
      - pin:
          number: GPIO3
          allow_other_uses: true
          mode: INPUT_PULLUP
        on_wake:
          - globals.set:
              id: wake_source
              value: '3'
      - pin:
          number: GPIO4
          allow_other_uses: true
          mode: INPUT_PULLUP
        on_wake:
          - globals.set:
              id: wake_source
              value: '4'
      - pin:
          number: GPIO5
          allow_other_uses: true
          mode: INPUT_PULLUP
        on_wake:
          - globals.set:
              id: wake_source
              value: '5'
    mode: ANY_LOW
  on_wake:
    - if:
        condition:
          lambda: 'return cause != deep_sleep::WAKEUP_CAUSE_GPIO;'
        then:
          - globals.set:
              id: wake_source
              value: '1'
            
